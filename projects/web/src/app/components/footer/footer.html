<footer class="footer">
  <div class="wrapper">
    <div class="footer__wrapper">
      <h2>Контакты</h2>
      <h3>Мои социальные сети</h3>
      <div class="footer__list">
        @for (link of socialLinks; track link.href) {
          <a
            class="footer__social"
            [href]="link.href"
            target="_blank"
            [attr.aria-label]="link.label"
            rel="noopener noreferrer"
            [appTrackClick]="link.eventName"
            [eventParams]="{ placement: 'footer' }"
          >
            <app-icon [icon]="link.icon"></app-icon>
          </a>
        }
      </div>
    </div>
  </div>
</footer>
